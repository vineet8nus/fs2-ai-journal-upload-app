_schema-version: '3.2'
ID: fs2-ai-journal-upload-app
version: 1.0.0
description: AI-Assisted Journal Upload (PoC) — CAP + Fiori Elements + SAP AI Core

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        # bundle the Fiori Elements app so the CAP service serves it as static
        # content (CAP serves ./app from its working dir); the approuter routes
        # /journalui -> srv-api.
        - mkdir -p gen/srv/app
        - cp -r app/journalui gen/srv/app/journalui

modules:
  # ---- CAP service (OData V4 + Fiori app static content) ------------------
  - name: fs2-journal-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: fs2-journal-xsuaa
      - name: fs2-journal-destination
      - name: fs2-journal-connectivity
      - name: fs2-journal-aicore
    properties:
      MASTERDATA_MODE: live
      ORCHESTRATION_MODE: live
      POSTING_MODE: stub
      AICORE_ORCH_DEPLOYMENT: d2929a33e5abf95d
      AICORE_RESOURCE_GROUP: default
      DEFAULT_COMPANY_CODE: 'SG01'
      DEFAULT_CURRENCY: SGD

  # ---- Application router -------------------------------------------------
  - name: fs2-journal-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: fs2-journal-xsuaa
      - name: fs2-journal-destination
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: fs2-journal-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: fs2-journal-upload-${space}

  # Reuse subaccount destinations (SHD250SYSTEM, ai-core-destination) and
  # the Cloud Connector (Training-BC-Dev) for on-premise S/4 reach.
  - name: fs2-journal-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: fs2-journal-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # Reuse the existing AI Core (Generative AI Hub) instance for orchestration.
  - name: fs2-journal-aicore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: default_aicore
